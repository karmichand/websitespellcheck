<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Spell & Grammar Checker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .url-input {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        .url-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .options {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
        }

        .stat-value.errors {
            color: #e74c3c;
        }

        .stat-value.success {
            color: #27ae60;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        .error-section {
            margin-top: 25px;
        }

        .error-section h3 {
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        .error-list {
            list-style: none;
        }

        .error-item {
            background: #fff5f5;
            border-left: 4px solid #e74c3c;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 0 8px 8px 0;
        }

        .error-item.grammar {
            background: #fff8e5;
            border-left-color: #f39c12;
        }

        .error-word {
            font-weight: 600;
            color: #e74c3c;
        }

        .error-message {
            font-weight: 600;
            color: #f39c12;
        }

        .error-context {
            margin-top: 8px;
            padding: 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #555;
        }

        .error-suggestions {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #666;
        }

        .error-suggestions strong {
            color: #27ae60;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: #fee;
            color: #c0392b;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .no-errors {
            text-align: center;
            padding: 40px;
            color: #27ae60;
        }

        .no-errors svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            color: white;
            opacity: 0.8;
            margin-top: 30px;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .summary {
                grid-template-columns: 1fr;
            }

            .options {
                flex-direction: column;
                gap: 10px;
            }

            header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Website Spell & Grammar Checker</h1>
            <p>Enter a URL to check for spelling and grammar errors</p>
        </header>

        <div class="card">
            <form id="checkForm">
                <div class="form-group">
                    <label for="url">Website URL</label>
                    <input
                        type="text"
                        id="url"
                        name="url"
                        class="url-input"
                        placeholder="example.com or https://example.com"
                        required
                    >
                </div>

                <div class="options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="checkSpelling" checked>
                        Check Spelling
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="checkGrammar" checked>
                        Check Grammar
                    </label>
                </div>

                <button type="submit" class="btn" id="submitBtn">
                    Check Website
                </button>
            </form>
        </div>

        <div class="card loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing website content...</p>
            <p style="font-size: 0.9rem; color: #666; margin-top: 10px;">
                This may take a moment for larger websites
            </p>
        </div>

        <div class="card results" id="results">
            <div id="alertContainer"></div>

            <div class="summary" id="summary">
                <div class="stat">
                    <div class="stat-value" id="elementsCount">0</div>
                    <div class="stat-label">Text Elements</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="spellingCount">0</div>
                    <div class="stat-label">Spelling Errors</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="grammarCount">0</div>
                    <div class="stat-label">Grammar Errors</div>
                </div>
            </div>

            <div id="errorDetails"></div>
        </div>
    </div>

    <footer>
        <p>Powered by PySpellChecker & LanguageTool</p>
    </footer>

    <script>
        const form = document.getElementById('checkForm');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const url = document.getElementById('url').value;
            const checkSpelling = document.getElementById('checkSpelling').checked;
            const checkGrammar = document.getElementById('checkGrammar').checked;

            if (!checkSpelling && !checkGrammar) {
                alert('Please select at least one check option');
                return;
            }

            // Show loading, hide results
            loading.classList.add('active');
            results.classList.remove('active');
            submitBtn.disabled = true;

            try {
                const response = await fetch('/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: url,
                        check_spelling: checkSpelling,
                        check_grammar: checkGrammar,
                    }),
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'An error occurred');
                    return;
                }

                showResults(data);
            } catch (error) {
                showError('Failed to connect to server: ' + error.message);
            } finally {
                loading.classList.remove('active');
                submitBtn.disabled = false;
            }
        });

        function showError(message) {
            results.classList.add('active');
            document.getElementById('alertContainer').innerHTML = `
                <div class="alert alert-error">${escapeHtml(message)}</div>
            `;
            document.getElementById('summary').style.display = 'none';
            document.getElementById('errorDetails').innerHTML = '';
        }

        function showResults(data) {
            results.classList.add('active');
            document.getElementById('summary').style.display = 'grid';
            document.getElementById('alertContainer').innerHTML = '';

            // Update stats
            document.getElementById('elementsCount').textContent = data.text_elements_count;

            const spellingEl = document.getElementById('spellingCount');
            spellingEl.textContent = data.spelling_errors.length;
            spellingEl.className = 'stat-value ' + (data.spelling_errors.length > 0 ? 'errors' : 'success');

            const grammarEl = document.getElementById('grammarCount');
            grammarEl.textContent = data.grammar_errors.length;
            grammarEl.className = 'stat-value ' + (data.grammar_errors.length > 0 ? 'errors' : 'success');

            // Show error details
            const errorDetails = document.getElementById('errorDetails');

            if (data.spelling_errors.length === 0 && data.grammar_errors.length === 0) {
                errorDetails.innerHTML = `
                    <div class="no-errors">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                        <h3>No errors found!</h3>
                        <p>The website content looks good.</p>
                    </div>
                `;
                return;
            }

            let html = '';

            if (data.spelling_errors.length > 0) {
                html += `
                    <div class="error-section">
                        <h3>Spelling Errors (${data.spelling_errors.length})</h3>
                        <ul class="error-list">
                            ${data.spelling_errors.map(error => `
                                <li class="error-item">
                                    <span class="error-word">"${escapeHtml(error.word)}"</span>
                                    <div class="error-context">${escapeHtml(error.context)}</div>
                                    ${error.suggestions.length > 0 ? `
                                        <div class="error-suggestions">
                                            <strong>Suggestions:</strong> ${error.suggestions.map(s => escapeHtml(s)).join(', ')}
                                        </div>
                                    ` : ''}
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            }

            if (data.grammar_errors.length > 0) {
                html += `
                    <div class="error-section">
                        <h3>Grammar Errors (${data.grammar_errors.length})</h3>
                        <ul class="error-list">
                            ${data.grammar_errors.map(error => `
                                <li class="error-item grammar">
                                    <span class="error-message">${escapeHtml(error.message)}</span>
                                    <div class="error-context">${escapeHtml(error.context)}</div>
                                    ${error.suggestions.length > 0 ? `
                                        <div class="error-suggestions">
                                            <strong>Suggestions:</strong> ${error.suggestions.map(s => escapeHtml(s)).join(', ')}
                                        </div>
                                    ` : ''}
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            }

            errorDetails.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
