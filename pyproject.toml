[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "websitespellcheck"
version = "1.0.0"
description = "A tool to check websites for spelling and grammar errors"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["spell-check", "grammar", "website", "web-scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pyspellchecker>=0.7.0",
    "language-tool-python>=2.7.0",
]

[project.scripts]
websitespellcheck = "websitespellcheck.cli:main"

[project.urls]
Homepage = "https://github.com/example/websitespellcheck"
Repository = "https://github.com/example/websitespellcheck"

[tool.setuptools.packages.find]
where = ["."]
